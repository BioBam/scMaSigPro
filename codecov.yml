# Codecov status checks, posted once test-coverage.yaml uploads a report
# (it needs the CODECOV_TOKEN secret). The project status fails when the
# coverage of the package falls below its target, and the patch status
# when the lines that a pull request changes are covered less than theirs.
comment: false
coverage:
  status:
    project:
      default:
        target: 80%
        threshold: 1%
        informational: false
    patch:
      default:
        target: 85%
