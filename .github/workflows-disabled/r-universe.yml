# Builds and checks the package exactly as R-universe and the Bioconductor
# submission system will, including BiocCheck, without deploying anywhere.
# Reference: https://docs.r-universe.dev/bioconductor/
#
# This is the authoritative pre-submission check. Expect BiocCheck ERRORs
# (runnable examples) until the roadmap's documentation phase is complete.
name: Test R-universe

on:
  push:
    branches: [main, devel]
  # pull_request:
  workflow_dispatch:

jobs:
  build:
    name: R-universe testing
    uses: r-universe-org/workflows/.github/workflows/build.yml@v3
    with:
      universe: bioc
      organization: bioconductor # enables BiocCheck
