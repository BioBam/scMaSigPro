# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# R CMD check --as-cran of the package, with its tests (snapshots included)
# and its vignettes, on macOS, Windows and Ubuntu with the released R and on
# Ubuntu with R-devel. The dependencies, Bioconductor packages and Suggests
# included, are installed by pak. Runs on pull requests to main, on pushes to
# main, weekly and on demand. Every job is skipped on any repository other
# than spriyansh/scMaSigPro, such as BioBam/scMaSigPro after a sync.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly on Monday 06:00 UTC, so breakage in upstream packages or external
    # resources is caught even when nothing is pushed.
    - cron: '0 6 * * 1'
  workflow_dispatch:

name: R-CMD-check.yaml

permissions:
  contents: read

# A new push to a pull request cancels the run of its previous commit; runs
# on main wait for each other instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  R-CMD-check:
    if: github.repository == 'spriyansh/scMaSigPro'

    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # testthat skips every expect_snapshot() when NOT_CRAN is unset, and
      # check-r-package does not set it.
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v7

      - name: Install qpdf (macOS)
        if: runner.os == 'macOS'
        run: brew install qpdf

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
