# Builds and checks the package as R-universe builds the packages of its
# Bioconductor universe, without deploying anything: the source package with
# its vignettes, R CMD check on Linux with R-devel and R-release, a
# WebAssembly build, and BiocCheck, which R-universe runs without the checks
# of the R version and of the support site account. macOS and Windows are
# skipped: R-CMD-check.yaml checks them with the released R, and R-universe
# would also check them with the previous R release, which the package does
# not support (Depends: R (>= 4.6.0)).
# Reference: https://docs.r-universe.dev/bioconductor/
#
# Runs on pull requests to main, on pushes to main and on demand. The job is
# skipped on any repository other than spriyansh/scMaSigPro.
name: Test R-universe

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run of its previous commit; runs
# on main wait for each other instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: github.repository == 'spriyansh/scMaSigPro'
    name: R-universe testing
    uses: r-universe-org/workflows/.github/workflows/build.yml@v3
    with:
      universe: bioc
      organization: bioconductor # enables BiocCheck
      skip: macos windows
