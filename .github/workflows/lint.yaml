# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# Runs lintr with the settings of .lintr and lists the lints in the log and
# as annotations of the pull request. Advisory: the job does not fail on
# lints (LINTR_ERROR_ON_LINT: true in env would make it fail). Runs on pull
# requests to main and on pushes to main. The job is skipped on any
# repository other than spriyansh/scMaSigPro.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: lint.yaml

permissions:
  contents: read

# A new push to a pull request cancels the run of its previous commit; runs
# on main wait for each other instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    if: github.repository == 'spriyansh/scMaSigPro'
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::lintr, local::.
          needs: lint

      - name: Lint
        run: lintr::lint_package()
        shell: Rscript {0}
